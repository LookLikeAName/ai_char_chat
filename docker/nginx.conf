server {
  listen 80;
  server_name _;
  # 用 Docker 內建的 DNS 動態解析 api：api 重啟後位址可能改變，寫死在 proxy_pass 的話
  # nginx 只在啟動時解析一次，之後會一直連到舊的位址（502）。用變數才會依 valid 的時間重新解析。
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api http://api:3000;
  root /usr/share/nginx/html;
  # 頭像上限 5 MB，多留一點給 multipart 標頭
  client_max_body_size 6m;

  # 匯入 avatar：檔案裡有 base64 的頭像與聊天紀錄
  location = /api/avatars/import {
    client_max_body_size 64m;
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_read_timeout 180s;
  }

  location /api/ {
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # LLM 回應可能比較久（補完 avatar 設定等）
    proxy_read_timeout 180s;
  }

  location /media/ {
    proxy_pass $api;
    expires 7d;
  }

  location = /ws {
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # 前端路由（/chats/...、/settings/...）都回 index.html
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
